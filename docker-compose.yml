services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs}
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: geba_acs-web:latest
    # Config sensible (MSSQL_XSYS_*, BIOSTAR_*, etc.) desde .env; el bloque
    # environment de abajo la pisa para el cableado de Postgres/Django en Docker.
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs}
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      # Templates sin cachear: un cambio de .html se ve al refrescar, sin restart.
      DJANGO_TEMPLATE_RELOAD: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    # Código montado en vivo: los cambios NO requieren rebuild de la imagen.
    # gunicorn --reload recarga los workers al tocar un .py; los templates se
    # leen sin caché (DJANGO_TEMPLATE_RELOAD=1). Solo hace falta rebuild si
    # cambian requirements.txt o el Dockerfile.
    volumes:
      - .:/app
    command:
      - gunicorn
      - acs.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=120
      - --reload
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Liveness por socket (no depende de ALLOWED_HOSTS ni del status HTTP).
      test: ["CMD", "python", "-c", "import socket,sys; socket.create_connection(('localhost',8000),3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Sincronización incremental del espejo xSys cada X horas (default 6h).
  sync:
    build: .
    image: geba_acs-web:latest
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs}
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
    command: >
      sh -c "while true; do
               python manage.py xsys_sync || echo 'xsys_sync fallo (se reintenta)';
               sleep ${XSYS_SYNC_INTERVAL:-21600};
             done"
    # Código en vivo: `docker compose restart sync` aplica cambios sin rebuild.
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Poller en tiempo real: ÚNICO cliente que consulta CD_ES en MSSQL cada 1s y
  # lo replica local. Las pantallas de los puestos consultan al `web`, no a MSSQL.
  poller:
    build: .
    image: geba_acs-web:latest
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs}
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
    command: ["python", "manage.py", "xsys_poll", "--interval", "1"]
    # Código en vivo: `docker compose restart poller` aplica cambios sin rebuild.
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Poller del log de eventos de BioStar (accesos faciales por-equipo): única
  # fuente con identidad de facial, ya que en CD_ES colapsan en un controlador.
  biostar-poller:
    build: .
    image: geba_acs-web:latest
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs}
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
    command: ["python", "manage.py", "biostar_poll", "--interval", "0.5"]
    # Código en vivo: `docker compose restart biostar-poller` aplica cambios sin rebuild.
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Listener por polling de marcas de un molinete Intelektron API-3000: lee
  # list_marks cada INTELEKTRON_INTERVAL s y persiste en IntelektronEvent (solo
  # escucha, no autoriza). Requiere INTELEKTRON_IP en .env para arrancar.
  intelektron-listener:
    build: .
    image: geba_acs-web:latest
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs}
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-prod}
    command: ["python", "manage.py", "intelektron_listener",
              "--ip", "${INTELEKTRON_IP}",
              "--port", "${INTELEKTRON_PORT:-3001}",
              "--source-node", "${INTELEKTRON_SOURCE_NODE:-0}",
              "--dest-node", "${INTELEKTRON_DEST_NODE:-1}",
              "--interval", "${INTELEKTRON_INTERVAL:-5}"]
    # Código en vivo: `docker compose restart intelektron-listener` aplica cambios sin rebuild.
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
